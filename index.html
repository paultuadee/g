<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd6b7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ระบายสี">
<title>Sticker Play · สมุดศิลปะของหนู</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#BFE0F5;
  font-family:-apple-system,"Noto Sans Thai",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

#sky{position:absolute;inset:0;z-index:0}

#topbar{position:relative;z-index:2;flex:0 0 auto;height:11vh;min-height:52px;
  display:flex;align-items:center;justify-content:center;gap:2.2vh}
.topbtn{width:9vh;height:9vh;min-width:46px;min-height:46px;border:none;background:none;
  padding:0;display:block;transition:transform .09s}
.topbtn:active{transform:scale(.9)}
.topbtn[disabled]{opacity:.32}
.topbtn svg{width:100%;height:100%;display:block}
#btnPhoto{width:7vh;height:7vh;min-width:38px;min-height:38px;opacity:.85}

#stage{position:relative;z-index:2;flex:1 1 auto;display:flex;align-items:center;
  justify-content:center;min-height:0;padding:.5vh 1vh}
#card{position:relative;border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 6px 18px rgba(30,60,90,.22)}
#card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#input{position:absolute;inset:0;z-index:2;touch-action:none}
#stickers{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}

.sticker{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:auto;touch-action:none}
.sticker img{width:100%;height:100%;display:block;pointer-events:none}
.sticker.sel{outline:3px dashed rgba(40,90,140,.75);outline-offset:2px;border-radius:6px}
#stickerKill{position:absolute;z-index:6;width:56px;height:56px;border:none;padding:0;
  background:none;display:none}
#stickerKill.on{display:block}

.row{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-around;gap:.6vh;padding:0 1.2vh}
#rowColor{height:11vh;min-height:48px}
#rowTex{height:13vh;min-height:56px}
#rowTool{height:18vh;min-height:76px;border-radius:16px 16px 0 0;
  background:linear-gradient(#EFD7AE,#CFAC7C);padding:0 1vh}

.swatch{border:none;background:none;padding:0;border-radius:50%;
  width:9.5vh;height:9.5vh;min-width:44px;min-height:44px;transition:transform .1s}
.swatch:active{transform:scale(.88)}
.swatch.on{transform:scale(1.12)}
.swatch svg,.swatch canvas{width:100%;height:100%;display:block;border-radius:50%}

.tool{border:none;background:none;padding:0;width:15%;height:100%;
  display:flex;align-items:flex-end;justify-content:center;transition:transform .1s}
.tool:active{transform:scale(.9)}
.tool svg{width:100%;height:100%;display:block}
.tool.on{transform:translateY(-6%) scale(1.06)}

#page{border:none;background:#F5C24A;border-radius:50%;
  width:7.5vh;height:7.5vh;min-width:36px;min-height:36px;color:#5B3D06;
  font-size:3.4vh;line-height:1;font-weight:500}

#flash{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.55)}
#flash.on{display:flex}
#flash svg{width:34vh;height:34vh}

#sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(20,40,60,.55)}
#sheet.on{display:flex;align-items:center;justify-content:center}
#sheetBox{background:#fff;border-radius:18px;padding:18px;width:min(560px,88vw);
  max-height:86vh;overflow:auto}
#sheetBox h2{font-size:17px;font-weight:500;margin-bottom:12px;color:#26404F}
.mrow{display:flex;flex-wrap:wrap;gap:10px}
.mbtn{flex:1 1 46%;min-height:56px;border:1.5px solid #C8D6E0;background:#F7FBFD;
  border-radius:12px;font-size:15px;color:#22384A;padding:10px}
.mbtn:active{background:#E4F0F8}
.mbtn.danger{border-color:#EBB4B4;background:#FDF3F3;color:#8C2C2C}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
#gal img{width:100%;border-radius:8px;border:1px solid #DDE6EC;display:block}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pickgrid button{border:1.5px solid #D4E1EA;background:#fff;border-radius:10px;padding:4px;aspect-ratio:4/3}
.pickgrid svg{width:100%;height:100%;display:block}
#rot{position:fixed;inset:0;z-index:40;background:#BFE0F5;display:none;
  align-items:center;justify-content:center;font-size:22px;color:#245068;text-align:center;padding:30px}
@media (orientation:portrait){#rot{display:flex}}

:root{--ink:#554b43;--mint:#719c8a;--cream:#fffaf0} html,body{background:#f3e9d9;color:var(--ink);font-family:'Trebuchet MS',Tahoma,sans-serif}button{cursor:pointer;color:inherit;font:inherit}button:focus-visible{outline:3px solid #498c79;outline-offset:4px}#sky{display:none}
#app{display:grid;grid-template-columns:190px minmax(0,1fr) 210px;grid-template-rows:82px minmax(0,1fr) 132px;gap:18px;padding:18px 26px 20px;background:radial-gradient(ellipse at 60% 25%,#fff9eb99,transparent 65%),repeating-linear-gradient(2deg,#ad805007 0 1px,transparent 1px 7px),#f1e6d5}
#topbar{grid-column:1/-1;grid-row:1;height:auto;min-height:0;justify-content:flex-end;gap:10px;border-bottom:1px solid #c9b79d60;padding-bottom:14px}.brand{margin-right:auto;display:flex;align-items:center;gap:12px}.brand-mark{background:#e7ad87;border:3px solid #fff5e6;border-radius:18px;box-shadow:0 3px 0 #be896650;width:48px;height:48px;display:grid;place-items:center;font-size:28px}.brand strong{display:block;font-size:23px;letter-spacing:-.7px}.brand small{display:block;font-size:11px;letter-spacing:2px;margin-top:5px;color:#9b8170}.topbtn,#btnPhoto{width:43px;height:43px;min-width:43px;min-height:43px;padding:5px;border-radius:14px;background:#fffaf2;box-shadow:0 3px 0 #d7c8b5;opacity:1}.softbtn{min-height:42px;border:1px solid #d9cbb7;border-radius:13px;padding:8px 14px;background:#fffaf1;font-size:12px;font-weight:bold;box-shadow:0 3px 0 #d7c8b560}.softbtn.active{background:#dceadd;border-color:#9ab39b}
#stage{grid-column:2;grid-row:2;padding:30px 12px 20px;min-width:0;background:#d7c0a14a;border:1px solid #d3b89555;border-radius:22px;box-shadow:inset 0 2px 10px #8b62300b}#stage:before{content:'YOUR LITTLE MASTERPIECE';position:absolute;top:12px;font-size:9px;letter-spacing:2.4px;color:#a18870}#card{border-radius:5px;box-shadow:0 2px 2px #8a6e5430,0 13px 24px #8a6e5425;outline:8px solid #fffcf3}#card:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.19;background-image:url('paper.svg');mix-blend-mode:multiply}
.row{padding:17px 14px;gap:10px;border:1px solid #e3d6c5;background:#fffaf0;border-radius:21px;box-shadow:0 4px 0 #d7c8b544;justify-content:center;align-content:start}.row:before{width:100%;flex-shrink:0;font-size:11px;letter-spacing:1.8px;font-weight:bold;color:#917a64;text-align:left;margin-bottom:6px}#rowColor{grid-column:1;grid-row:2;height:auto;min-height:0;flex-wrap:wrap;overflow:auto}#rowColor:before{content:'01 / COLOR PALETTE'}#rowTex{grid-column:3;grid-row:2;height:auto;min-height:0;flex-wrap:wrap;overflow:auto}#rowTex:before{content:'02 / MAGIC TEXTURES'}.swatch{position:relative;width:59px;height:59px;min-width:0;min-height:0;flex:0 0 59px;margin:0 3px 17px;box-shadow:0 3px 6px #856e4c20;background:#f4ede1;border:4px solid #f4ede1}.swatch.on{outline:2px solid #729987;outline-offset:3px;transform:none}.swatch:after{content:attr(data-label);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#7e6b59}#rowTex .swatch{border-radius:13px;width:63px;height:63px;flex-basis:63px;margin-bottom:20px}#rowTex .swatch canvas{border-radius:8px}#page{width:100%;height:29px;min-height:29px;border-radius:9px;font-size:12px;background:#eee4d2;color:#756149}
#rowTool{grid-column:1/-1;grid-row:3;height:auto;min-height:0;background:repeating-linear-gradient(0deg,#ba894009 0 1px,transparent 1px 4px),linear-gradient(#eed8b9,#e6c69b);border:1px solid #d3b48d;border-radius:22px;padding:8px 24px 17px;gap:16px;box-shadow:inset 0 2px 0 #fff9,0 5px 0 #bd95693a}.tool{position:relative;flex:1;width:auto;max-width:145px;height:100%;border-radius:14px;background:#b0865910;box-shadow:inset 0 2px 5px #9d703b12;align-items:center;padding:0 0 12px}.tool svg{height:90px;filter:drop-shadow(2px 4px 2px #785b3b25)}.tool:after{content:attr(data-label);position:absolute;bottom:0;font-size:11px;font-weight:bold;color:#7c6148}.tool.on{transform:translateY(-3px);background:#fff7e780;box-shadow:0 4px 9px #8a67311a,inset 0 0 0 2px #fff8}#sheetBox{background:#fffaf0;border:5px solid #fff;border-radius:23px;box-shadow:0 20px 70px #33241740}#sheetBox h2{color:#67513d}.demo-art{width:100%;display:block;border-radius:14px;margin:12px 0}.note{font-size:12px;line-height:1.7;color:#8b7765}.close-sheet{float:right;border:none;background:#efe1ce;border-radius:50%;width:32px;height:32px}.demo-swatches{display:flex;gap:10px;justify-content:center}.demo-swatches canvas{width:64px;height:64px;border-radius:12px}#rot{display:none!important}
@media(max-width:1000px){#app{grid-template-columns:144px minmax(0,1fr) 156px;gap:12px;padding:12px;grid-template-rows:65px minmax(0,1fr) 108px}.row{padding:12px 6px;gap:9px}.row:before{font-size:9px;letter-spacing:.7px}.swatch{width:46px;height:46px;flex-basis:46px;margin:0 4px 15px}#rowTex .swatch{width:49px;height:49px;flex-basis:49px;margin-bottom:17px}.brand strong{font-size:18px}.brand small{font-size:8px}.tool svg{height:76px}.softbtn{padding:8px;font-size:11px}}
@media(max-width:650px) and (orientation:portrait){#app{grid-template-columns:1fr 1fr;grid-template-rows:60px minmax(160px,1fr) 94px 110px 88px;gap:8px;padding:8px}#topbar{gap:5px;padding-bottom:6px}.brand{gap:5px}.brand-mark{display:none}.brand strong{font-size:14px}.brand small{font-size:7px;letter-spacing:1px}.topbtn,#btnPhoto{width:32px;height:36px;min-width:32px;min-height:36px}.softbtn{padding:5px;font-size:10px}#stage{grid-column:1/-1;grid-row:2}#rowColor{grid-column:1/-1;grid-row:3;flex-wrap:nowrap;justify-content:flex-start;align-items:center;padding:8px 10px;gap:10px}.row:before{display:none}.swatch{flex-basis:42px;width:42px;height:42px;margin:0 1px 13px}#rowTex{grid-column:1/-1;grid-row:4;flex-wrap:nowrap;justify-content:flex-start;align-items:center;padding:8px 10px}#rowTex .swatch{flex-basis:48px;width:48px;height:48px}#page{min-width:54px;width:54px}#rowTool{grid-column:1/-1;grid-row:5;padding:3px 6px 9px;gap:6px}.tool svg{height:60px}.tool:after{font-size:9px}}
@media(max-height:620px) and (orientation:landscape){#app{grid-template-rows:52px minmax(0,1fr) 85px;gap:8px;padding:8px 14px}.brand strong{font-size:18px}.tool svg{height:60px}#rowTool{padding:2px 12px 13px}.row{padding-top:8px}.row:before{margin-bottom:0}.swatch{height:40px;width:40px;flex-basis:40px}#rowTex .swatch{height:42px;width:42px;flex-basis:42px}.brand-mark{height:38px;width:38px}}
.row,#sheetBox{touch-action:pan-x pan-y}#sheetBox button{touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <svg id="sky" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <rect width="100" height="100" fill="#BFE0F5"/>
    <ellipse cx="14" cy="26" rx="13" ry="6" fill="#fff" opacity=".55"/>
    <ellipse cx="86" cy="40" rx="12" ry="5.5" fill="#fff" opacity=".5"/>
    <ellipse cx="24" cy="62" rx="10" ry="4.5" fill="#fff" opacity=".4"/>
  </svg>

  <div id="topbar"><div class="brand"><span class="brand-mark">✿</span><div><strong>Sticker Play</strong><small>สมุดศิลปะของหนู</small></div></div><button class="softbtn active" id="btnSmart" aria-pressed="true" title="ดินสอและพู่กันวาดไม่เลยขอบ">✓ ไม่เลยขอบ</button><button class="softbtn" id="btnArt" aria-label="เลือกภาพระบายสี"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="24" height="26" rx="5" fill="#fff" stroke="#b1885e" stroke-width="2"/><circle cx="21" cy="11" r="4" fill="#f7bf48"/><path d="m7 25 7-12 5 8 3-4 4 8" fill="#91bc6d"/></svg><span>เลือกรูป</span></button><button class="softbtn" id="btnDemo">ดูตัวอย่าง ✧</button><button class="softbtn" id="btnSound" aria-pressed="false" title="เปิดเสียงเอฟเฟกต์และเสียงพูดภาษาอังกฤษ">เสียง: ปิด</button>
    <button class="topbtn" id="btnUndo" aria-label="ย้อนกลับ"></button>
    <button class="topbtn" id="btnRedo" aria-label="ทำซ้ำ"></button>
    <button class="topbtn" id="btnSave" aria-label="บันทึก"></button>
    <button class="topbtn" id="btnPhoto" aria-label="เมนูผู้ปกครอง"></button>
  </div>

  <div id="stage">
    <div id="card">
      <canvas id="cBg"></canvas>
      <canvas id="cFill"></canvas>
      <canvas id="cPaint"></canvas>
      <canvas id="cLine"></canvas>
      <div id="stickers"></div>
      <div id="input"></div>
      <button id="stickerKill" aria-label="ลบสติกเกอร์"></button>
    </div>
  </div>

  <div id="dock"><div class="row" id="rowTool"></div><div class="palette-stack"><div class="row" id="rowColor"></div><div class="palette-note"><span>เลือกสี แล้ววาดกันเลย!</span><button id="btnTexture" aria-expanded="false" aria-controls="rowTex"><span id="textureChip"></span>พื้นผิว · <span id="textureName">Smooth</span> ▴</button></div></div><div class="row" id="rowTex" aria-label="พื้นผิว"></div></div><div id="hint" role="status" aria-live="polite"></div>
</div>

<div id="flash" aria-hidden="true">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#2FB57F"/>
  <path d="M30 52 L44 66 L71 36" stroke="#fff" stroke-width="10" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<div id="sheet"><div id="sheetBox"></div></div>
<div id="rot">หมุน iPad เป็นแนวนอน<br>เพื่อเริ่มระบายสี</div>

<input type="file" id="filePick" accept="image/*" hidden>
<script>
(function(){
"use strict";
// ข้อมูลศิลป์ทั้งหมดของแอป
// เพิ่มลาย เพิ่มสติกเกอร์ เพิ่มภาพระบายสี ทำได้ที่ไฟล์นี้ไฟล์เดียว

const COLORS = [
  '#E8342A', '#F5901E', '#F7CB2F', '#5FB63B', '#2E86D8',
  '#7B5FD4', '#EE72A8', '#8A5A2B', '#FFFFFF', '#2B2B2B'
];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= (1 + f); g *= (1 + f); b *= (1 + f); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// ---------------------------------------------------------------- หัวแปรง
// mask ถูกเรนเดอร์เป็นภาพขาวดำแล้วย้อมสีตอนใช้งาน
const TIPS = {
  round(c, s) {
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, '#fff'); g.addColorStop(.72, '#fff');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
  },
  soft(c, s) {
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
  },
  chalk(c, s) {
    c.fillStyle = '#fff';
    for (let i = 0; i < 260; i++) {
      const a = Math.random() * 6.283, r = Math.pow(Math.random(), .55) * s / 2;
      c.globalAlpha = .5 + Math.random() * .5;
      c.fillRect(s / 2 + Math.cos(a) * r, s / 2 + Math.sin(a) * r, 1.6, 1.6);
    }
    c.globalAlpha = 1;
  },
  spray(c, s) {
    c.fillStyle = '#fff';
    for (let i = 0; i < 150; i++) {
      const a = Math.random() * 6.283, r = Math.pow(Math.random(), .4) * s / 2;
      c.globalAlpha = .25 + Math.random() * .45;
      c.beginPath();
      c.arc(s / 2 + Math.cos(a) * r, s / 2 + Math.sin(a) * r, .9, 0, 6.283);
      c.fill();
    }
    c.globalAlpha = 1;
  },
  crayon(c, s) {
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,.95)');
    g.addColorStop(.8, 'rgba(255,255,255,.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
    c.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 90; i++) {
      c.globalAlpha = Math.random() * .5;
      c.fillRect(Math.random() * s, Math.random() * s, 2.4, 1.4);
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  },
  star(c, s) {
    c.fillStyle = '#fff'; c.beginPath();
    const R = s / 2 * .92, r = R * .45;
    for (let i = 0; i < 10; i++) {
      const a = -1.5708 + i * 0.6283, rr = i % 2 ? r : R;
      c[i ? 'lineTo' : 'moveTo'](s / 2 + Math.cos(a) * rr, s / 2 + Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  },
  heart(c, s) {
    c.fillStyle = '#fff'; const k = s / 100;
    c.beginPath();
    c.moveTo(50 * k, 84 * k);
    c.bezierCurveTo(4 * k, 52 * k, 18 * k, 12 * k, 50 * k, 36 * k);
    c.bezierCurveTo(82 * k, 12 * k, 96 * k, 52 * k, 50 * k, 84 * k);
    c.fill();
  },
  sparkle(c, s) {
    c.fillStyle = '#fff'; const h = s / 2;
    c.beginPath();
    c.moveTo(h, 0); c.quadraticCurveTo(h * 1.12, h * .88, s, h);
    c.quadraticCurveTo(h * 1.12, h * 1.12, h, s);
    c.quadraticCurveTo(h * .88, h * 1.12, 0, h);
    c.quadraticCurveTo(h * .88, h * .88, h, 0);
    c.fill();
  }
};

// ---------------------------------------------------------------- ลายพื้นผิว
// tintable:true คือลายที่เปลี่ยนสีตามสีที่เด็กเลือกได้
const P = [];
const add = (id, tintable, draw) => P.push({ id, tintable, draw });

add('grass', true, (c, s, col) => {
  c.fillStyle = shade(col, .42); c.fillRect(0, 0, s, s);
  c.strokeStyle = shade(col, -.28); c.lineWidth = s * .045; c.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const x = (i * 7.3 % 1) * s, y = (i * 3.7 % 1) * s;
    c.beginPath(); c.moveTo(x, y + s * .12); c.lineTo(x + s * .03, y - s * .05); c.stroke();
  }
});
add('dots', true, (c, s, col) => {
  c.fillStyle = shade(col, .5); c.fillRect(0, 0, s, s);
  c.fillStyle = shade(col, -.1);
  [[.25, .25], [.75, .75], [.75, .25], [.25, .75]].forEach(([x, y]) => {
    c.beginPath(); c.arc(x * s, y * s, s * .11, 0, 6.283); c.fill();
  });
});
add('hearts', true, (c, s, col) => {
  c.fillStyle = shade(col, .55); c.fillRect(0, 0, s, s);
  c.fillStyle = shade(col, -.05);
  const h = (cx, cy, r) => {
    c.beginPath(); c.moveTo(cx, cy + r);

function mix(hex, f) {
  const n = parseInt((hex[0] === '#' ? hex.slice(1) : hex), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= (1 + f); g *= (1 + f); b *= (1 + f); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

  const col = opt.color || '#F5B93A';
  const sh = `<ellipse cx="28" cy="108" rx="17" ry="5" fill="url(#sh${u})"/>`;

  if (id === 'pencil') {
    return wrap(`<defs>${SHADOW(u)}
      ${g3('pb' + u, mix(col, -.42), mix(col, .5), mix(col, .04), mix(col, -.34))}
      ${g3('pw' + u, '#D9A276', '#FFE3C6', '#E0B489', '#C98F60')}
      ${g3('pp' + u, '#D4658F', '#FFC2D8', '#F0A0BE', '#C85B85')}
      ${g3('sv' + u, '#8E9AA6', '#FCFDFE', '#C3CDD7', '#7E8B98')}</defs>
      ${sh}
      <rect x="20" y="16" width="16" height="11" rx="3" fill="url(#pp${u})"/>
      <rect x="20" y="26" width="16" height="6" fill="url(#sv${u})"/>
      <rect x="20" y="32" width="16" height="47" fill="url(#pb${u})"/>
      <rect x="23" y="34" width="2.6" height="43" rx="1.3" fill="#fff" opacity=".5"/>
      <path d="M20 79 L36 79 L28 103 Z" fill="url(#pw${u})"/>
      <path d="M24.6 92 L31.4 92 L28 103 Z" fill="#3A3A3A"/>`);
  }

  if (id === 'brush') {
    return wrap(`<defs>${SHADOW(u)}
      ${g3('bh' + u, '#8A5A14', '#E5AE5E', '#C08B33', '#7C4E0F')}
      ${g3('bs' + u, mix(col, -.45), mix(col, .42), mix(col, -.02), mix(col, -.4))}
      ${g3('sv' + u, '#8E9AA6', '#FCFDFE', '#C3CDD7', '#7E8B98')}</defs>
      ${sh}
      <rect x="20" y="12" width="16" height="42" rx="7" fill="url(#bh${u})"/>
      <rect x="23" y="16" width="2.6" height="34" rx="1.3" fill="#fff" opacity=".45"/>
      <rect x="17" y="52" width="22" height="15" rx="3" fill="url(#sv${u})"/>
      <rect x="17" y="56" width="22" height="1.6" fill="#7E8B98" opacity=".6"/>
      <path d="M17 67 L39 67 L34 98 Q28 103 22 98 Z" fill="url(#bs${u})"/>
      <path d="M22 70 L25 70 L23.5 96 Z" fill="#fff" opacity=".35"/>`);

  if (id === 'eraser') {
    return wrap(`<defs>${SHADOW(u)}
      ${g3('ew' + u, '#CFD4D9', '#FFFFFF', '#EDF0F2', '#C4CAD0')}
      ${g3('eb' + u, '#2E6FB0', '#A8D3F7', '#5E9FD6', '#2A6AAA')}</defs>
      ${sh}
      <rect x="10" y="38" width="36" height="64" rx="8" fill="url(#ew${u})"/>
      <path d="M10 74 h36 v20 a8 8 0 0 1 -8 8 h-20 a8 8 0 0 1 -8 -8 z" fill="url(#eb${u})"/>
      <ellipse cx="20" cy="49" rx="5" ry="7" fill="#fff" opacity=".75"/>`);
  }

  if (id === 'bucket') {
    return wrap(`<defs>${SHADOW(u)}
      ${g3('sv' + u, '#8E9AA6', '#FCFDFE', '#C3CDD7', '#7E8B98')}
      ${g3('pc' + u, mix(col, -.4), mix(col, .45), mix(col, .02), mix(col, -.36))}</defs>
      ${sh}
      <path d="M12 36 Q28 14 44 36" stroke="#96A3B0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M11 38 L45 38 L40 100 L16 100 Z" fill="url(#sv${u})"/>

      <ellipse cx="28" cy="38" rx="13.5" ry="4" fill="url(#pc${u})"/>
      <path d="M41 44 q6 6 3 14 q-6 3 -8 -4 z" fill="${mix(col, -.05)}"/>`);
  }

  if (id === 'roller') {
    const head = opt.tile
      ? `<pattern id="rp${u}" width="14" height="14" patternUnits="userSpaceOnUse">
         <image href="${opt.tile}" width="14" height="14"/></pattern>`
      : `<linearGradient id="rp${u}" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0" stop-color="${mix(col, .35)}"/>
         <stop offset="1" stop-color="${mix(col, -.15)}"/></linearGradient>`;
    return wrap(`<defs>${SHADOW(u)}${head}
      <linearGradient id="cy${u}" x1="0" y1="0" x2="0" y2="1">

      <rect x="4" y="22" width="48" height="22" rx="10" fill="url(#rp${u})"/>
      <rect x="4" y="22" width="48" height="22" rx="10" fill="url(#cy${u})"/>
      <path d="M28 44 v14 q0 9 8 9 h2" stroke="#9AA6B2" stroke-width="4" fill="none" stroke-linecap="round"/>

  // sticker
  return wrap(`<defs>${SHADOW(u)}
    ${g3('pk' + u, '#D9739E', '#FFD3E4', '#F7A8C8', '#CF6390')}</defs>
    ${sh}
    <path d="M10 22 l5 4 5 -4 5 4 5 -4 5 4 5 -4 5 4 v70 l-5 -4 -5 4 -5 -4 -5 4 -5 -4 -5 4 -5 -4 z" fill="url(#pk${u})"/>
    <path d="M15 26 L20 26 L25 92 L20 92 Z" fill="#fff" opacity=".3"/>
    <circle cx="28" cy="58" r="12" fill="#fff" opacity=".95"/>
    <circle cx="28" cy="52" r="4.2" fill="#F58FB6"/><circle cx="33.8" cy="56.2" r="4.2" fill="#F58FB6"/>
    <circle cx="31.6" cy="63" r="4.2" fill="#F58FB6"/><circle cx="24.4" cy="63" r="4.2" fill="#F58FB6"/>
    <circle cx="22.2" cy="56.2" r="4.2" fill="#F58FB6"/>
    <circle cx="28" cy="58" r="3.4" fill="#FFE07A"/>`);
}

// เอนจินวาดภาพ ทำงานบน canvas 2D ล้วน ไม่พึ่งไลบรารีภายนอก

const W = 1600, H = matchMedia('(orientation:portrait)').matches ? Math.round(1600*Math.max(1,Math.min(1.7,(innerHeight-(innerWidth<=700?252:172)-28)/(innerWidth-32)))) : 960;
const TS = 128;                 // ขนาดช่องสำหรับเก็บประวัติ
const SPRITE = 128;             // ความละเอียดหัวแปรง

const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

// ---------------------------------------------------------------- ประวัติ
class History {
  constructor(eng) {
    this.e = eng; this.past = []; this.future = [];
    this.max = 20; this.budget = 56e6; this.bytes = 0; this.cur = null;
  }
  begin() { this.cur = new Map(); }
  touch(layer, x0, y0, x1, y1) {
    if (!this.cur) return;
    const ctx = this.e.ctx[layer];
    const tx0 = Math.max(0, (x0 / TS) | 0), tx1 = Math.min(Math.ceil(W / TS) - 1, (x1 / TS) | 0);
    const ty0 = Math.max(0, (y0 / TS) | 0), ty1 = Math.min(Math.ceil(H / TS) - 1, (y1 / TS) | 0);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const k = layer + ':' + tx + ':' + ty;
      if (this.cur.has(k)) continue;
      const w = Math.min(TS, W - tx * TS), h = Math.min(TS, H - ty * TS);
      this.cur.set(k, { layer, tx, ty, w, h, before: ctx.getImageData(tx * TS, ty * TS, w, h) });
    }
  }
  commit() {
    if (!this.cur || !this.cur.size) { this.cur = null; return; }
    const items = [];
    for (const it of this.cur.values()) {
      it.after = this.e.ctx[it.layer].getImageData(it.tx * TS, it.ty * TS, it.w, it.h);
      items.push(it);
      this.bytes += it.w * it.h * 8;
    }
    this.past.push(items); this.future.length = 0; this.cur = null;
    while (this.past.length > this.max || this.bytes > this.budget) this.drop();
  }
  drop() {
    const old = this.past.shift(); if (!old) return;
    for (const it of old) this.bytes -= it.w * it.h * 8;
  }
  apply(items, which) {
    for (const it of items)
      this.e.ctx[it.layer].putImageData(it[which], it.tx * TS, it.ty * TS);
  }
  undo() {
    const it = this.past.pop(); if (!it) return false;
    this.apply(it, 'before'); this.future.push(it); return true;
  }
  redo() {
    const it = this.future.pop(); if (!it) return false;
    this.apply(it, 'after'); this.past.push(it); return true;
  }
  clear() { this.past.length = 0; this.future.length = 0; this.bytes = 0; this.cur = null; }
  get canUndo() { return this.past.length > 0; }
  get canRedo() { return this.future.length > 0; }
}

// ---------------------------------------------------------------- เอนจิน
class Engine {
  constructor(canvases) {
    this.cv = canvases;                       // {bg,fill,paint,line}
    this.ctx = {};
    for (const k in canvases) {
      canvases[k].width = W; canvases[k].height = H;
      this.ctx[k] = canvases[k].getContext('2d', { willReadFrequently: true });
    }
    this.ctx.bg.fillStyle = '#fff'; this.ctx.bg.fillRect(0, 0, W, H);
    this.history = new History(this);
    this.color = '#E8342A';
    this.ink = INKS[0];
    this.size = 64;
    this.tool = 'pencil';
    this._masks = new Map(); this._sprites = new Map(); this._tiles = new Map();
    this._wall = null; this._wallD = null; this._band = null;
    this._gap = -1; this._dirty = true;
    this.onChange = () => { };
  }

  // ------------------------------------------------------- หัวแปรงและลาย
  mask(tipName) {
    if (this._masks.has(tipName)) return this._masks.get(tipName);
    const c = document.createElement('canvas'); c.width = c.height = SPRITE;
    TIPS[tipName](c.getContext('2d'), SPRITE);
    this._masks.set(tipName, c); return c;
  }
  tile(patternId, color) {
    const p = PATTERNS.find(x => x.id === patternId);
    const key = patternId + (p.tintable ? color : '');
    if (this._tiles.has(key)) return this._tiles.get(key);
    const c = document.createElement('canvas'); c.width = c.height = 64;
    p.draw(c.getContext('2d'), 64, color);
    this._tiles.set(key, c); return c;
  }
  sprite(color) { return this.spriteFor(this.ink, color); }
  spriteFor(ink, color) {
    const key = ink.id + '|' + color;
    if (this._sprites.has(key)) return this._sprites.get(key);
    const c = document.createElement('canvas'); c.width = c.height = SPRITE;
    const x = c.getContext('2d');
    if (ink.kind === 'tip') {
      x.drawImage(this.mask(ink.tip), 0, 0);
      x.globalCompositeOperation = 'source-in';
      x.fillStyle = color; x.fillRect(0, 0, SPRITE, SPRITE);
    } else {
      const t = this.tile(ink.pattern, color);
      x.fillStyle = x.createPattern(t, 'repeat');
      x.fillRect(0, 0, SPRITE, SPRITE);
      x.globalCompositeOperation = 'destination-in';
      x.drawImage(this.mask('round'), 0, 0);
    }
    this._sprites.set(key, c); return c;
  }
  inkColor(i) {
    if (!this.ink.rainbow) return this.color;
    const h = ((i * 9) % 360) | 0;
    return `hsl(${h} 85% 55%)`;
  }
  tileURL() {
    if (this.ink.kind !== 'pattern') return null;
    return this.tile(this.ink.pattern, this.color).toDataURL();
  }

  // ------------------------------------------------------- การลากเส้น
  strokeStart(x, y, pr) {
    this.history.begin();
    this._n = 0; this._last = null; this._acc = 0;
    this._bb = [x, y, x, y];
    this.strokeMove(x, y, pr, true);
  }
  strokeMove(x, y, pr, first) {
    const eraser = this.tool === 'eraser';
    const layers = eraser ? ['paint', 'fill'] : ['paint'];
    const ink = this.ink;
    const base = this.tool === 'pencil' ? this.size * .42 : this.size * (ink.size || 1);
    const sz = Math.max(4, base * (0.42 + 0.58 * (pr || 1)));
    const step = Math.max(1.4, sz * (ink.spacing || (this.tool === 'pencil' ? .12 : .22)));

    let p0 = this._last || { x, y };
    let dx = x - p0.x, dy = y - p0.y;
    let dist = Math.hypot(dx, dy);
    if (!first && dist < step * .6) return;
    const steps = first ? 1 : Math.max(1, Math.ceil(dist / step));

    for (let i = 1; i <= steps; i++) {
      const t = first ? 1 : i / steps;
      let px = p0.x + dx * t, py = p0.y + dy * t;
      const sc = ink.scatter || 0;
      if (sc) { px += (Math.random() - .5) * sz * sc * 2; py += (Math.random() - .5) * sz * sc * 2; }
      this.stamp(px, py, sz, layers, eraser);
    }
    this._last = { x, y };
  }
  stamp(x, y, sz, layers, eraser) {
    const r = sz / 2;
    this._bb[0] = Math.min(this._bb[0], x - r); this._bb[1] = Math.min(this._bb[1], y - r);
    this._bb[2] = Math.max(this._bb[2], x + r); this._bb[3] = Math.max(this._bb[3], y + r);
    for (const L of layers) this.history.touch(L, x - r - 2, y - r - 2, x + r + 2, y + r + 2);

    if (eraser) {
      for (const L of layers) {
        const c = this.ctx[L];
        c.save(); c.globalCompositeOperation = 'destination-out';
        c.drawImage(this.mask('round'), x - r, y - r, sz, sz); c.restore();
      }
      this._dirty = true; return;
    }
    const c = this.ctx.paint;
    const sp = this.sprite(this.inkColor(this._n));
    c.save();
    c.globalAlpha = this.ink.alpha || 1;
    if (this.ink.spin) {
      c.translate(x, y); c.rotate(Math.random() * 6.283); c.drawImage(sp, -r, -r, sz, sz);
    } else {
      c.drawImage(sp, x - r, y - r, sz, sz);
    }
    c.restore();
    this._n++; this._dirty = true;
  }
  strokeEnd() { this.history.commit(); this.onChange(); }

  // ------------------------------------------------------- ถังสีอัจฉริยะ
  wallMask(gap) {
    if (this._wall && !this._dirty && this._gap === gap) return this._wall;
    const a = this.ctx.line.getImageData(0, 0, W, H).data;
    const b = this.ctx.paint.getImageData(0, 0, W, H).data;
    const m = new Uint8Array(W * H);
    for (let i = 0, p = 3; i < m.length; i++, p += 4)
      if (a[p] > 45 || b[p] > 45) m[i] = 1;
    this._wall = m;
    this._wallD = Engine.dilate(m, gap);
    // แถบบางระหว่างเส้นจริงกับเส้นที่ถูกขยาย ใช้คืนสีให้ชิดเส้นโดยไม่ต้องขยายทั้งภาพ
    const band = [];
    for (let i = 0; i < m.length; i++) if (this._wallD[i] && !m[i]) band.push(i);
    this._band = Int32Array.from(band);
    this._gap = gap; this._dirty = false;
    return m;
  }
  static dilate(src, r) {
    const tmp = new Uint8Array(W * H), out = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      const o = y * W;
      for (let x = 0; x < W; x++) {
        let v = 0;
        for (let k = -r; k <= r; k++) {
          const xx = x + k;
          if (xx >= 0 && xx < W && src[o + xx]) { v = 1; break; }
        }
        tmp[o + x] = v;
      }
    }
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        let v = 0;
        for (let k = -r; k <= r; k++) {
          const yy = y + k;
          if (yy >= 0 && yy < H && tmp[yy * W + x]) { v = 1; break; }
        }
        out[y * W + x] = v;
      }
    }
    return out;
  }
  static flood(block, sx, sy) {
    const seen = new Uint8Array(W * H);
    const si = sy * W + sx;
    if (block[si]) return null;
    const st = [sx, sy]; seen[si] = 1;
    while (st.length) {
      const y = st.pop(), x0 = st.pop();
      const o = y * W;
      let l = x0, r = x0;
      while (l > 0 && !block[o + l - 1]) { l--; seen[o + l] = 1; }
      while (r < W - 1 && !block[o + r + 1]) { r++; seen[o + r] = 1; }
      for (let x = l; x <= r; x++) {
        seen[o + x] = 1;
        for (const ny of [y - 1, y + 1]) {
          if (ny < 0 || ny >= H) continue;
          const ni = ny * W + x;
          if (!block[ni] && !seen[ni]) { seen[ni] = 1; st.push(x, ny); }
        }
      }
    }
    return seen;
  }
  fillAt(x, y, gap = 3) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    const wall = this.wallMask(gap), wallD = this._wallD, band = this._band;
    if (wallD[y * W + x]) return false;
    const reg = Engine.flood(wallD, x, y);
    if (!reg) return false;

    // คืนสีเข้าไปให้ชิดเส้นจริง ทำเฉพาะพิกเซลในแถบบาง จึงเร็วกว่าขยายทั้งภาพมาก
    for (let k = 0; k <= gap; k++) {
      const addList = [];
      for (let bi = 0; bi < band.length; bi++) {
        const i = band[bi];
        if (reg[i]) continue;
        const px = i % W;
        if ((px > 0 && reg[i - 1]) || (px < W - 1 && reg[i + 1]) ||
            (i >= W && reg[i - W]) || (i < W * H - W && reg[i + W])) addList.push(i);
      }
      if (!addList.length) break;
      for (let j = 0; j < addList.length; j++) reg[addList[j]] = 1;
    }

    const img = new ImageData(W, H), d = img.data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let i = 0; i < reg.length; i++) {
      if (!reg[i] || wall[i]) continue;
      d[i * 4 + 3] = 255;
      const px = i % W, py = (i / W) | 0;
      if (px < x0) x0 = px; if (px > x1) x1 = px;
      if (py < y0) y0 = py; if (py > y1) y1 = py;
    }
    if (x1 < 0) return false;

    const t = mk(), tc = t.getContext('2d');
    tc.putImageData(img, 0, 0);
    tc.globalCompositeOperation = 'source-in';
    tc.fillStyle = this.ink.kind === 'pattern'
      ? tc.createPattern(this.tile(this.ink.pattern, this.color), 'repeat')
      : this.color;
    tc.fillRect(0, 0, W, H);

    this.history.begin();
    this.history.touch('fill', x0, y0, x1, y1);
    this.ctx.fill.drawImage(t, 0, 0);
    this.history.commit();
    this.onChange();
    return true;
  }

  // ------------------------------------------------------- ภาพและพื้นหลัง
  clearAll() {
    this.ctx.fill.clearRect(0, 0, W, H);
    this.ctx.paint.clearRect(0, 0, W, H);
    this.ctx.line.clearRect(0, 0, W, H);
    this.ctx.bg.fillStyle = '#fff'; this.ctx.bg.fillRect(0, 0, W, H);
    this.history.clear(); this._dirty = true; this.onChange();
  }
  loadLineArt(id) {
    const art = LINEARTS.find(a => a.id === id) || LINEARTS[0];
    this.clearAll();
    const c = this.ctx.line;
    c.save();
    const artScale=Math.min(W/200,H/150);
    c.setTransform(artScale,0,0,artScale,(W-200*artScale)/2,(H-150*artScale)/2);
    c.strokeStyle = '#1E1E1E'; c.lineWidth = 2.2;
    c.lineJoin = 'round'; c.lineCap = 'round';
    for (const d of art.paths) c.stroke(new Path2D(d));
    c.restore();
    this._dirty = true;
  }
  drawPhoto(img) {
    const c = this.ctx.bg;
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    const s = Math.max(W / img.width, H / img.height);
    const w = img.width * s, h = img.height * s;
    c.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    this._dirty = true; this.onChange();
  }
  // แปลงภาพพื้นหลังเป็นลายเส้น 3 ระดับ ทำงานบนเครื่องทั้งหมด
  // วิธีการ ทำให้ภาพเนียนก่อน แล้วแบ่งความสว่างเป็นชั้น ๆ
  // เส้นคือรอยต่อระหว่างชั้น จึงได้เส้นที่ปิดเป็นวงและเทสีได้
  static boxBlur(src, r) {
    if (r < 1) return src.slice();
    const a = new Float32Array(W * H), b = new Float32Array(W * H);
    const d = 2 * r + 1;
    for (let y = 0; y < H; y++) {
      const o = y * W;
      let sum = src[o] * (r + 1);
      for (let x = 1; x <= r; x++) sum += src[o + Math.min(x, W - 1)];
      for (let x = 0; x < W; x++) {
        a[o + x] = sum / d;
        sum += src[o + Math.min(x + r + 1, W - 1)] - src[o + Math.max(x - r, 0)];
      }
    }
    for (let x = 0; x < W; x++) {
      let sum = a[x] * (r + 1);
      for (let y = 1; y <= r; y++) sum += a[Math.min(y, H - 1) * W + x];
      for (let y = 0; y < H; y++) {
        b[y * W + x] = sum / d;
        sum += a[Math.min(y + r + 1, H - 1) * W + x] - a[Math.max(y - r, 0) * W + x];
      }
    }
    return b;
  }
  photoToLineArt(level = 1) {
    const n = W * H;
    const src = this.ctx.bg.getImageData(0, 0, W, H).data;
    let g = new Float32Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4)
      g[i] = src[p] * .299 + src[p + 1] * .587 + src[p + 2] * .114;

    const radius = [9, 5, 2][level];
    g = Engine.boxBlur(g, radius);
    g = Engine.boxBlur(g, Math.max(1, radius >> 1));

    // ยืดช่วงความสว่างโดยตัดหัวท้าย 2% กันภาพมืดหรือสว่างเกินไป
    const hist = new Int32Array(256);
    for (let i = 0; i < n; i++) hist[Math.max(0, Math.min(255, g[i] | 0))]++;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > n * .02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * .02) { hi = v; break; } }
    if (hi - lo < 12) { hi = lo + 12; }
    const norm = new Float32Array(n);
    for (let i = 0; i < n; i++)
      norm[i] = Math.max(0, Math.min(.9999, (g[i] - lo) / (hi - lo)));

    // เลือกจำนวนชั้นที่ให้ปริมาณเส้นใกล้เป้าหมายที่สุด ปรับเองตามภาพแต่ละใบ
    const target = [.022, .040, .065][level];
    const cand = [[2, 3, 4], [3, 4, 5, 6], [4, 5, 6, 7, 8]][level];
    let bestK = cand[0], bestErr = Infinity, bestEdge = null;
    for (const K of cand) {
      const q = new Uint8Array(n);
      for (let i = 0; i < n; i++) q[i] = (norm[i] * K) | 0;
      const e = new Uint8Array(n);
      let cnt = 0;
      for (let y = 0; y < H - 1; y++) {
        const o = y * W;
        for (let x = 0; x < W - 1; x++) {
          const i = o + x;
          if (q[i] !== q[i + 1] || q[i] !== q[i + W]) { e[i] = 1; cnt++; }
        }
      }
      const err = Math.abs(cnt / n - target);
      if (err < bestErr) { bestErr = err; bestK = K; bestEdge = e; }
    }

    // ทำเส้นให้หนาขึ้นเพื่อให้เด็กเห็นชัดและเทสีไม่รั่ว
    const thick = Engine.dilate(bestEdge, level === 2 ? 1 : 2);

    const img = new ImageData(W, H), d = img.data;
    for (let i = 0, p = 3; i < n; i++, p += 4) if (thick[i]) d[p] = 255;

    this.ctx.line.clearRect(0, 0, W, H);
    this.ctx.line.putImageData(img, 0, 0);
    this.ctx.bg.fillStyle = '#fff'; this.ctx.bg.fillRect(0, 0, W, H);
    this.ctx.fill.clearRect(0, 0, W, H);
    this.ctx.paint.clearRect(0, 0, W, H);
    this.history.clear(); this._dirty = true; this.onChange();
    this.lastPhotoLevels = bestK;
  }

  // ------------------------------------------------------- ส่งออก
  flatten(stickerImgs) {
    const c = mk(), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.drawImage(this.cv.bg, 0, 0);
    x.drawImage(this.cv.fill, 0, 0);
    x.drawImage(this.cv.paint, 0, 0);
    x.drawImage(this.cv.line, 0, 0);
    for (const s of stickerImgs || []) {
      x.save();
      x.translate(s.x, s.y); x.rotate(s.rot); x.scale(s.scale, s.scale);
      x.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h);
      x.restore();
    }
    return c;
  }
}

const rowTex = $('#rowTex');

function inkList() { return state.kid ? ['round','soft','crayon','p-linen','p-woodgrain','p-watercolor','p-grass','p-sand','p-hearts','p-stars','p-sky','p-candy'].map(id=>INKS.find(i=>i.id===id)) : INKS; }
function inkPreview(ink) {
  const c = document.createElement('canvas');
  c.width = c.height = 72;
  const x = c.getContext('2d');
  if (ink.kind === 'pattern') {
    x.fillStyle = x.createPattern(eng.tile(ink.pattern, state.color), 'repeat');
    x.fillRect(0, 0, 72, 72);
  } else {
    x.fillStyle = '#F0F0F0'; x.fillRect(0, 0, 72, 72);
    const sp = eng.spriteFor(ink, state.color);
    x.drawImage(sp, 4, 4, 64, 64);
  }
  c.style.boxShadow = 'inset 0 0 0 5px #fff, inset 0 8px 10px rgba(255,255,255,.45),'
    + ' inset 0 -8px 12px rgba(0,0,0,.15), 0 2px 5px rgba(20,50,80,.3)';
  return c;
}
function buildInks() {
  rowTex.innerHTML = '';
  const list = inkList();
  const pages = Math.ceil(list.length / PER);
  state.page = Math.min(state.page, pages - 1);
  const start = state.page * PER;
  list.slice(start, start + PER).forEach((ink, i) => {
    const idx = start + i;
    const b = document.createElement('button');
    b.className = 'swatch' + (idx === state.ink ? ' on' : '');
    b.appendChild(inkPreview(ink)); b.dataset.label=INK_NAMES[ink.id] || ink.id.replace('p-',''); b.setAttribute('aria-label',b.dataset.label); b.setAttribute('aria-pressed',idx===state.ink);
    b.onclick = () => { state.ink = idx; eng.ink = ink; if(!['pencil','brush','roller'].includes(state.tool))state.tool='pencil'; eng.tool=state.tool; say('texture'); buildInks(); buildTools(); rowTex.classList.remove('open'); $('#btnTexture').setAttribute('aria-expanded','false'); };
    rowTex.appendChild(b);
  });
  if (pages > 1) {
    const p = document.createElement('button');
    p.id = 'page'; p.textContent = `More · ${state.page+1}/${pages} →`; p.setAttribute('aria-label','More textures');
    p.onclick = () => { state.page = (state.page + 1) % pages; buildInks(); };
    rowTex.appendChild(p);
  }
}

// ---------------------------------------------------------------- การวาด
let drawing = false, activeId = null, lastPen = 0;
function pt(e) {
  const r = card.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function allowed(e) {
  if (e.pointerType === 'pen') { lastPen = Date.now(); return true; }
  return Date.now() - lastPen > 1200;      // กันฝ่ามือ เมื่อเพิ่งใช้ปากกา
}

input.addEventListener('pointerdown', (e) => {
  if (!allowed(e)) return;
  if (selected) deselect();
  const p = pt(e);
  if(state.tool==='sticker'){stampSticker(p.x,p.y);return;}

  if (state.tool === 'bucket' || state.tool === 'roller') {
    const keep = eng.ink;
    if (state.tool === 'bucket') eng.ink = INKS[0];
    eng.fillAt(p.x, p.y, 3);
    eng.ink = keep;
    return;
  }
  if (drawing) return;
  drawing = true; activeId = e.pointerId;
  input.setPointerCapture(e.pointerId);
  eng.ink = inkList()[state.ink] || INKS[0];
  eng.color = state.color; eng.tool = state.tool;
  if(eng.strokeStart(p.x,p.y,e.pressure||1)===false){drawing=false;activeId=null;input.releasePointerCapture(e.pointerId);}
});

input.addEventListener('pointermove', (e) => {
  if (!drawing || e.pointerId !== activeId) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = pt(ev);
    eng.strokeMove(p.x, p.y, ev.pressure || 1, false);
  }
});

const endStroke = (e) => {
  if (!drawing || (e && e.pointerId !== activeId)) return;
  drawing = false; activeId = null; eng.strokeEnd();
};
input.addEventListener('pointerup', endStroke);
input.addEventListener('pointercancel', endStroke);
input.addEventListener('lostpointercapture',endStroke);
window.addEventListener('blur',()=>endStroke());

// ---------------------------------------------------------------- สติกเกอร์
function place(s) {
  const r = card.getBoundingClientRect();
  const k = r.width / W;
  s.el.style.width = s.w * k + 'px';
  s.el.style.height = s.h * k + 'px';
  s.el.style.transform =
    `translate(${(s.x - s.w / 2) * k}px,${(s.y - s.h / 2) * k}px) rotate(${s.rot}rad) scale(${s.scale})`;
}
function placeKill() {
  if (!selected) { killBtn.classList.remove('on'); return; }
  const r = card.getBoundingClientRect(), k = r.width / W;
  killBtn.classList.add('on');
  killBtn.style.left = (selected.x * k + selected.w * k * selected.scale / 2 - 20) + 'px';
  killBtn.style.top = (selected.y * k - selected.h * k * selected.scale / 2 - 36) + 'px';
}
function select(s) { deselect(); selected = s; s.el.classList.add('sel'); placeKill(); }
function deselect() {
  if (selected) selected.el.classList.remove('sel');
  selected = null; killBtn.classList.remove('on');
}
killBtn.onclick = () => {
  if (!selected) return;
  selected.el.remove();
  stickers.splice(stickers.indexOf(selected), 1);
  deselect();
};

function addSticker(svgText) {
  const url = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgText);
  const img = new Image();
  const el = document.createElement('div');
  el.className = 'sticker';
  const im = document.createElement('img'); im.src = url; el.appendChild(im);
  const s = { el, img, x: W / 2, y: H / 2, w: 220, h: 220, scale: 1, rot: 0 };
  img.src = url;
  layerEl.appendChild(el);
  stickers.push(s);
  place(s); select(s);
  bindSticker(s);
}

function bindSticker(s) {
  const ptrs = new Map();
  let base = null;
  s.el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    select(s);
    s.el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      base = {
        d: Math.hypot(a.x - b.x, a.y - b.y),
        a: Math.atan2(b.y - a.y, b.x - a.x),
        scale: s.scale, rot: s.rot
      };
    }
  });
  s.el.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = card.getBoundingClientRect(), k = W / r.width;
    if (ptrs.size === 1) {
      s.x += (e.clientX - prev.x) * k;
      s.y += (e.clientY - prev.y) * k;
    } else if (ptrs.size === 2 && base) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      s.scale = Math.max(.25, Math.min(4, base.scale * d / base.d));
      s.rot = base.rot + (ang - base.a);
    }
    place(s); placeKill();
  });
  const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) base = null; };
  s.el.addEventListener('pointerup', up);
  s.el.addEventListener('pointercancel', up);
}

let db = null;
function openDB() {
  return new Promise((res) => {
    const r = indexedDB.open('paintbox', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('works', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; res(db); };

  });
}
function flat() {
  const imgs = stickers.map(s => ({
    img: s.el.querySelector('img'), x: s.x, y: s.y,
    w: s.w * s.scale, h: s.h * s.scale, scale: 1, rot: s.rot
  }));
  return eng.flatten(imgs);
}
async function saveWork() {
  const c = flat();

  if(!blob){showHint('บันทึกไม่สำเร็จ ลองอีกครั้งนะ');return;}
  try{if(db){await new Promise((resolve,reject)=>{const tx=db.transaction('works','readwrite');tx.objectStore('works').put({id:Date.now(),blob});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});}else{await exportImage(blob)}}catch{showHint('พื้นที่บันทึกไม่พอ กำลังดาวน์โหลดภาพแทน');await exportImage(blob);return;}

async function exportImage(blob) {

  }

}

// Linear-time flood: each pixel enters the queue once, even on a large blank sheet.
Engine.flood=function(block,sx,sy){
 if(sx<0||sy<0||sx>=W||sy>=H||block[sy*W+sx])return null;
 const seen=new Uint8Array(W*H),queue=new Int32Array(W*H);let head=0,tail=0;
 const seed=sy*W+sx;seen[seed]=1;queue[tail++]=seed;
 while(head<tail){const i=queue[head++],x=i%W;
  if(x>0&&!block[i-1]&&!seen[i-1]){seen[i-1]=1;queue[tail++]=i-1}
  if(x<W-1&&!block[i+1]&&!seen[i+1]){seen[i+1]=1;queue[tail++]=i+1}
  if(i>=W&&!block[i-W]&&!seen[i-W]){seen[i-W]=1;queue[tail++]=i-W}
  if(i<W*(H-1)&&!block[i+W]&&!seen[i+W]){seen[i+W]=1;queue[tail++]=i+W}
 }return seen;
};
// Each stroke is constrained to the connected region containing its first point.
Engine.prototype.regionAt=function(x,y){
 const sx=Math.floor(x),sy=Math.floor(y);if(sx<0||sy<0||sx>=W||sy>=H)return false;
 const data=this.ctx.line.getImageData(0,0,W,H).data, walls=new Uint8Array(W*H);let count=0;
 for(let i=0;i<walls.length;i++){walls[i]=data[i*4+3]>32?1:0;count+=walls[i]}
 if(!count)return null;
 // A start on the printed outline is ambiguous: wait for a start inside a region.
 if(walls[sy*W+sx])return false;
 const region=Engine.flood(walls,sx,sy),image=new ImageData(W,H);
 for(let i=0;i<region.length;i++)image.data[i*4+3]=region[i]?255:0;
 const mask=mk();mask.getContext('2d').putImageData(image,0,0);return mask;
};
const originalStart=Engine.prototype.strokeStart;
Engine.prototype.strokeStart=function(x,y,pressure){
 this._smartMask=null;
 if(smartEnabled&&(this.tool==='pencil'||this.tool==='brush')){
  const region=this.regionAt(x,y);if(region===false){showHint('เริ่มระบายด้านในเส้นนะจ๊ะ');return false}this._smartMask=region;
 }
 originalStart.call(this,x,y,pressure);return true;
};
const originalStamp=Engine.prototype.stamp;
Engine.prototype.stamp=function(x,y,size,layers,eraser){
 if(eraser)return originalStamp.call(this,x,y,size,layers,true);
 const margin=Math.ceil(size*.75+3),left=Math.floor(x-margin),top=Math.floor(y-margin),side=margin*2+2;

 const d=this._dab.getContext('2d');d.clearRect(0,0,side,side);d.save();d.translate(-left,-top);
 if(this.ink.kind==='pattern'){
  d.fillStyle=d.createPattern(this.tile(this.ink.pattern,this.color),'repeat');d.fillRect(left,top,side,side);
  d.globalCompositeOperation='destination-in';d.drawImage(this.mask('round'),x-size/2,y-size/2,size,size);
 }else{
  const sprite=this.sprite(this.inkColor(this._n));
  if(this.ink.spin){d.translate(x,y);d.rotate(Math.random()*Math.PI*2);d.drawImage(sprite,-size/2,-size/2,size,size)}
  else d.drawImage(sprite,x-size/2,y-size/2,size,size);
 }
 d.restore();
 if(this._smartMask){d.save();d.globalCompositeOperation='destination-in';d.drawImage(this._smartMask,-left,-top);d.restore()}
 this.history.touch('paint',left,top,left+side,top+side);
 const c=this.ctx.paint;c.save();c.globalAlpha=this.ink.alpha||1;c.drawImage(this._dab,left,top);c.restore();

};
